<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivinanzas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./icon.png" type="image/x-icon">
</head>
<body>

    <div class="score-container">
        <span>✅ Acertadas: <strong id="correctCount">0</strong></span>
        <span>❌ Errores: <strong id="wrongCount">0</strong></span>
    </div>

    <div class="container">
        <h1>Adivinanzas</h1>
        <p id="riddle"></p>
        <input type="text" id="answer-input" placeholder="Tu respuesta...">
        <button onclick="checkAnswer()">Responder</button>
        <p id="result"></p>
    </div>

    <!-- Modal de completado -->
    <div class="modal-overlay" id="completion-modal">
        <div class="modal">
            <div class="modal-icon">🏆</div>
            <h2>¡Completado!</h2>
            <p>Terminaste todas las adivinanzas</p>
            <div class="modal-stats">
                <div class="stat correct">
                    <span class="stat-number" id="modal-correct">0</span>
                    <span class="stat-label">✅ Aciertos</span>
                </div>
                <div class="stat wrong">
                    <span class="stat-number" id="modal-wrong">0</span>
                    <span class="stat-label">❌ Errores</span>
                </div>
            </div>
            <button onclick="closeModal()">Jugar de nuevo</button>
        </div>
    </div>

    <footer>
        Hecho con <span class="heart">♥</span> por
        <a href="https://github.com/carlos-daniel07" target="_blank" rel="noopener noreferrer">Carlos Arteaga</a>
    </footer>

    <script src="./script.js"></script>
    
</body>
</html>
